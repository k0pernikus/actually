name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run pytest
  pypi:
    runs-on: ubuntu-latest
    needs: pytest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8
      - run: uv build
      - run: uv publish --trusted-publishing always
