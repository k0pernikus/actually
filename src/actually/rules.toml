[[rules]]
code = "ACTI001"
name = "no-if-else"
group = "actually-if-conditions"
status = "stable"
summary = "`else` on an `if` — flatten to guard clauses with early exits"
ruff_conflicts = [
  { rule = "PLR5501", reason = "PLR5501 (collapsible-else-if) collapses `else:` wrapping an `if` into `elif … else`, keeping an `else` on the `if` chain this rule forbids" },
]
rationale = '''
An `else` on an `if` hides the happy path one indent deeper and forces the reader to hold both
branches open at once. Invert the condition into a guard clause and exit early — `return`,
`raise`, `continue`, `break` — so the primary flow stays at the top indent and each decision
reads on its own. The `else` keyword inside a conditional expression is NOT this rule's target:
a flat ternary (`x = "a" if cond else "b"`) stays valid — its limits are ternary-not-nested
(ACTT001) and ternary-not-empty (ACTT002). The completion `else` on `for`, `while`, and `try`
is a different overload, banned separately by no-for-else (ACTE002), no-while-else (ACTE003),
and no-try-else (ACTE001).
'''
banned = '''
def describe(config):
    if config is None:
        return "missing"
    else:
        return str(config)
'''
wanted = '''
def describe(config):
    if config is None:
        return "missing"

    return str(config)
'''

[[rules]]
code = "ACTI002"
name = "no-elif"
group = "actually-if-conditions"
status = "stable"
summary = "`elif` — flatten to guard clauses with early exits"
ruff_conflicts = [
  { rule = "PLR5501", reason = "PLR5501 (collapsible-else-if) rewrites `else: if` into an `elif`, which this rule forbids" },
]
rationale = '''
An `elif` chain welds N decisions into one compound statement: every arm hangs off the first
`if`, the reader holds the whole ladder open, and inserting or reordering a case edits the
middle of the construct. The fixpoint is flat guard clauses — multiple `if` statements, each
with an early `return`, `raise`, `continue`, or `break` — nothing more: every decision stands
alone and appending a case is appending a statement. This rule bans exactly `elif`. When the
flattened arms all compare one shared subject, `prefer-match` (ACTI003) then escalates the
chain to a `match` statement — that judgement belongs to that rule, never to this one.
'''
banned = '''
def access_level(user, resource):
    if user.is_admin:
        return "admin"
    elif resource.is_public:
        return "read"
'''
wanted = '''
def access_level(user, resource):
    if user.is_admin:
        return "admin"

    if resource.is_public:
        return "read"

    return "none"
'''

[[rules]]
code = "ACTT001"
name = "ternary-not-nested"
group = "actually-ternaries"
status = "stable"
summary = "a ternary inside another ternary's arm (`elif` in expression form)"
rationale = '''
A ternary is the one permitted conditional expression, and only flat: a ternary nested inside
either arm is an `elif` chain in expression form, with reading order collapsing at exactly the
point where clarity matters most. Refactor to guard clauses — or, when the arms dispatch on a
single subject, one `match` statement (ACTI003).
'''
banned = '''
action = "beach" if sunny else "sleep" if night else "home"
'''
wanted = '''
def action(sunny, night):
    if sunny:
        return "beach"

    if night:
        return "sleep"

    return "home"
'''

[[rules]]
code = "ACTT002"
name = "ternary-not-empty"
group = "actually-ternaries"
status = "unstable"
summary = "a degenerate ternary arm (`None`, `\"\"`, empty container) — conditional inclusion in disguise"
ruff_conflicts = [
  { rule = "SIM108", reason = "SIM108 (if-else-block-instead-of-if-exp) rewrites an `if`/`else` assigning in both branches into a ternary; a `None`/empty branch becomes the degenerate arm this rule forbids" },
]
rationale = '''
An arm that exists only for conditional inclusion — `None`, an empty string, an empty container
literal — is a hidden `else` smuggling an absent case into the binding: the result is a
`T | None` (or an empty sentinel) every consumer must branch on again. Resolve the absence
before the binding exists — raise on absent input, branch at the boundary, or accumulate with
guarded appends when optional parts multiply.
'''
banned = '''
parsed = None if raw is None else parse(raw)
'''
wanted = '''
def parsed(raw):
    if raw is None:
        raise ValueError("raw input is required")

    return parse(raw)
'''

[[rules]]
code = "ACTI003"
name = "prefer-match"
group = "actually-if-conditions"
status = "unstable"
summary = "two or more consecutive conditional returns comparing one shared subject, closed by a terminal return or raise — dispatch written as control flow"
rationale = '''
A run of `if …: return` arms that all compare the same subject, closed by a terminal `return`
or `raise`, enumerates a closed dispatch — but written as sequential ifs the table is
invisible, the subject is re-evaluated per arm, and nothing marks the enumeration complete.
One `match` statement on that subject is the fixpoint: a single dispatch point with an
explicit default arm, the scrutinee evaluated once. Or-patterns (`case 403 | 409:`) fold arms
sharing a body, class patterns (`case str():`) dispatch on type, and the default arm fails
loud — reaching for `dict.get(key, default)` instead trades the loud unknown-value failure
for a silent wrong answer. The rule fires only on a genuinely shared scrutinee — this is the
second pass after `no-elif` (ACTI002) has flattened a chain to guards. Chains of independent
predicates are guard clauses
and STAY guard clauses — fabricating a scrutinee to force a `match`
(`match found, description == ALL:` with positional `case True, _:` arms) is the same if-chain
wearing `match` syntax, and worse: the tuple positions carry unnamed roles. Dependent guard
chains — a `parent is None` check narrowing what the next call may touch — are equally exempt.
No auto-fix: a synthesized raising default arm would alter behaviour — a RISKY rewrite
reserved for a human.
'''
banned = '''
def http_label(status):
    if status == 200:
        return "ok"

    if status == 404:
        return "missing"

    if status == 403:
        return "error"

    if status == 409:
        return "error"

    raise ValueError(status)
'''
wanted = '''
def http_label(status):
    match status:
        case 200:
            return "ok"

        case 404:
            return "missing"

        case 403 | 409:
            return "error"

        case _:
            raise ValueError(status)
'''

[[rules]]
code = "ACTE001"
name = "no-try-else"
group = "actually-completion-clauses"
status = "stable"
fix = "partial"
summary = "`else` on `try` — dedent the continuation after the `except` clauses"
ruff_conflicts = [
  { rule = "TRY300", reason = "TRY300 (try-consider-else) recommends moving a `return` out of the `try` body into an `else:` clause — the completion clause this rule forbids" },
]
rationale = '''
The `else` clause on `try`/`except` overloads `else` to mean "no exception was raised", putting
the normal, expected flow in the branch that reads as exceptional everywhere else in the
language. Dedent the continuation after the `except` clauses into straight-line code: it is
reached only when the `try` body raised nothing, which is exactly what following the block
already means. `format` rewrites this automatically when every `except` body exits (`return`,
`raise`, `continue`, `break`); when one falls through, the dedent would change behaviour, so it
is reported for human refactoring instead.
'''
banned = '''
def describe(path):
    try:
        config = load(path)
    except ParseError:
        return "invalid"
    else:
        return describe(config)
'''
wanted = '''
def describe(path):
    try:
        config = load(path)
    except ParseError:
        return "invalid"

    return describe(config)
'''

[[rules]]
code = "ACTE002"
name = "no-for-else"
group = "actually-completion-clauses"
status = "stable"
summary = "`else` on `for` — the loop-completion clause overloads `else`"
rationale = '''
The `else` clause on a `for` loop runs only when the loop finished without hitting a `break` —
overloading `else` to mean "completed", so the normal completion path sits in the branch that
reads as exceptional. Extract the search into a helper that returns early on a match; the
function tail then reads as the natural "nothing matched" case, with no `else` required.
'''
banned = '''
def first_even(numbers):
    for number in numbers:
        if number % 2 == 0:
            return number
    else:
        return None
'''
wanted = '''
def first_even(numbers):
    for number in numbers:
        if number % 2 == 0:
            return number

    return None
'''

[[rules]]
code = "ACTE003"
name = "no-while-else"
group = "actually-completion-clauses"
status = "stable"
summary = "`else` on `while` — the loop-completion clause overloads `else`"
rationale = '''
The `else` clause on a `while` loop runs only when the condition became false without a
`break` — the same overload as `for`/`else`, hiding the normal completion path in the
exceptional-looking branch. Restructure so the after-loop code follows the loop directly: a
`break`-search becomes a guard that returns on the match, with the fall-through as the
completion case.
'''
banned = '''
def scan(source, target):
    while source.has_next():
        if source.peek() == target:
            return source.take()
    else:
        return None
'''
wanted = '''
def scan(source, target):
    while source.has_next():
        if source.peek() == target:
            return source.take()

    return None
'''

[[rules]]
code = "ACTH001"
name = "multi-line-chain"
group = "actually-chains"
status = "unstable"
fix = "partial"
summary = "a chain of two or more invocations not one call per line under a `# well-actually: multi-line` anchor"
rationale = '''
A fluent chain reads one step per line — but ruff format joins any chain that fits the line
length, parentheses or not; its preview fluent style engages only past the limit, and no chain
analog of the magic trailing comma exists (astral-sh/ruff#8598). The one layout signal a
formatter cannot cross is a comment, and only on the chain's base-receiver line — on the open
paren it pins the parentheses while the chain inside still joins. `format` therefore rewrites
every chain of two or more invocations to break at the first call, one call per line, and
anchors the base line with `# well-actually: multi-line` — the base is the receiver of that
first call, so leading receiver attributes (`self.page`) fold onto it; run before `ruff format`,
the anchored layout is a fixpoint of both tools. Consecutive attribute-only steps share one line
(`.parent.parent`), an attribute between two calls rides with the call after it (`.b.bar()`), and
a chain ruff would render flat when bare — one with fewer than two attribute accesses whose value
is a call or subscript, such as a call-terminated two-call chain — additionally parenthesizes its
base receiver (`(make(1))`, `(self.page)`): without those parens ruff re-renders the short head
flat and relocates the anchor to the joined line's end. A stale
anchor — its chain shrunk below two
invocations — is stripped so the directive cannot rot. Chains carrying foreign comments or
multiline arguments are reported for human layout instead, and chains inside f-string
interpolations are exempt. This wanted state is a deliberate, temporary middle-ground — a best
effort to verticalize as far as ruff will preserve without fighting the formatter, not the
one-node-per-line ideal: an attribute between two calls rides with its call and a short chain
keeps its base parens, because otherwise ruff re-joins them. `ruff format` exposes no toggle to
relax this; a native fluent-chain control (astral-sh/ruff#8598) would retire the compromise.
'''
banned = '''
command = CommandLine.of("git").subcommand("config").argument(key)
'''
wanted = '''
command = (
    CommandLine  # well-actually: multi-line
    .of("git")
    .subcommand("config")
    .argument(key)
)
'''

[[rules]]
code = "ACTL001"
name = "trailing-comma"
group = "actually-literals"
status = "unstable"
fix = "full"
summary = "a dict/list/set literal whose last element lacks a trailing comma"
rationale = '''
Appending, removing, or reordering an element should touch exactly one line — without the
trailing comma the previous last element changes too, polluting every diff. The comma is also
the magic trailing comma that formatters (ruff, black) respect, pinning the multiline layout
instead of collapsing it back to one line.
'''
banned = '''
labels = {
    200: "ok",
    404: "missing"
}
'''
wanted = '''
labels = {
    200: "ok",
    404: "missing",
}
'''

[[rules]]
code = "ACTL002"
name = "one-element-per-line"
group = "actually-literals"
status = "unstable"
fix = "partial"
summary = "a dict/list/set literal with elements sharing a line with a bracket or each other"
rationale = '''
Json-like structures read as records: one element per line with the brackets on their own
lines makes membership scannable and keeps every future diff to the single line it concerns.
The fix rewrites the literal in place; a literal carrying comments or multiline elements is
reported for human formatting instead. Tuples are exempt — they appear in subscripts and type
expressions where this layout is not wanted.
'''
banned = '''
point = {"x": 1, "y": 2}
'''
wanted = '''
point = {
    "x": 1,
    "y": 2,
}
'''

[[rules]]
code = "ACTR001"
name = "blank-before-return"
group = "actually-returns"
status = "stable"
fix = "full"
summary = "a `return` stacked directly under other statements in its block"
rationale = '''
A `return` that follows other statements in its block is the exit point of the function —
stacked flush against the work above it, it reads as just another line. One blank line above
marks the handoff from computing the value to leaving with it.
'''
banned = '''
def f(baz):
    if baz:
        foo = 42 + 1337
        return foo
'''
wanted = '''
def f(baz):
    if baz:
        foo = 42 + 1337

        return foo
'''

[[rules]]
code = "ACTR002"
name = "blank-after-return"
group = "actually-returns"
status = "stable"
fix = "full"
summary = "code directly under a `return` line"
rationale = '''
Code on the line directly under a `return` — typically after the enclosing block dedents —
reads as if it belonged to the same thought. One blank line after the `return` marks that a
flow ended there and something new begins.
'''
banned = '''
def f(foo, bar, baz):
    if foo:
        return foo
    if bar:
        return baz
'''
wanted = '''
def f(foo, bar, baz):
    if foo:
        return foo

    if bar:
        return baz
'''
