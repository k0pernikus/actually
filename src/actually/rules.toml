[[rules]]
code = "ACTC001"
name = "no-else"
group = "actually-conditionals"
status = "stable"
fix = "partial"
summary = "`else` on `if`, and the completion clauses on `for`, `while`, `try`"
rationale = '''
An `else` clause hides the happy path one indent deeper and forces the reader to hold both
branches open. The completion clauses on `for`, `while`, and `try` are worse: they overload
`else` to mean "ran without `break`" or "raised no exception", putting the normal flow in the
branch that reads as exceptional everywhere else in the language. Invert the condition into a
guard clause and return early; dedent the continuation after `except`. `format` rewrites the
`try`/`except`/`else` case automatically when every `except` body already exits — the other
forms are reported for human refactoring.
'''
banned = '''
def describe(config):
    if config is None:
        return "missing"
    else:
        return str(config)
'''
wanted = '''
def describe(config):
    if config is None:
        return "missing"

    return str(config)
'''

[[rules]]
code = "ACTC002"
name = "no-elif"
group = "actually-conditionals"
status = "stable"
summary = "`elif` — N-way dispatch belongs in one `match` statement"
rationale = '''
An `elif` chain is N-way dispatch written as linear control flow: the reader evaluates every
arm in order to learn the routing. Structural pattern matching expresses the intent natively —
translated into a `match` statement the chain reaches its fixpoint: one dispatch point, an
explicit default arm (`case _`), and further reduction is a no-op. Class patterns
(`case str():`) cover type dispatch, and or-patterns (`case str() | list():`) fold arms that
share a body. A lookup table remains legitimate for a genuinely data-shaped value-to-value map
— but reaching for `dict.get(key, default)` to dodge the default arm trades the loud
unknown-value failure for a silent wrong answer. No auto-fix: synthesizing the default arm
means inventing a `raise` where the original silently fell through — a RISKY,
behaviour-altering rewrite reserved for a human.
'''
banned = '''
def label(code):
    if code == 200:
        return "ok"
    elif code == 404:
        return "missing"
'''
wanted = '''
def label(code):
    match code:
        case 200:
            return "ok"
        case 404:
            return "missing"
        case _:
            raise ValueError(f"unexpected code: {code}")
'''

[[rules]]
code = "ACTC003"
name = "ternary-not-nested"
group = "actually-conditionals"
status = "stable"
summary = "a ternary inside another ternary's arm (`elif` in expression form)"
rationale = '''
A ternary is the one permitted conditional expression, and only flat: a ternary nested inside
either arm is an `elif` chain in expression form, with reading order collapsing at exactly the
point where clarity matters most. Refactor to guard clauses — or, when the arms enumerate a
closed decision, one `match` statement (ACTC005).
'''
banned = '''
action = "beach" if sunny else "sleep" if night else "home"
'''
wanted = '''
def action(sunny, night):
    match sunny, night:
        case True, _:
            return "beach"

        case _, True:
            return "sleep"

        case _:
            return "home"
'''

[[rules]]
code = "ACTC004"
name = "ternary-not-empty"
group = "actually-conditionals"
status = "unstable"
summary = "a degenerate ternary arm (`None`, `\"\"`, empty container) — conditional inclusion in disguise"
rationale = '''
An arm that exists only for conditional inclusion — `None`, an empty string, an empty container
literal — is a hidden `else` smuggling an absent case into the binding: the result is a
`T | None` (or an empty sentinel) every consumer must branch on again. Resolve the absence
before the binding exists — raise on absent input, branch at the boundary, or accumulate with
guarded appends when optional parts multiply.
'''
banned = '''
parsed = None if raw is None else parse(raw)
'''
wanted = '''
def parsed(raw):
    if raw is None:
        raise ValueError("raw input is required")

    return parse(raw)
'''

[[rules]]
code = "ACTC005"
name = "prefer-match"
group = "actually-conditionals"
status = "unstable"
summary = "two or more consecutive conditional returns closed by a terminal return or raise — a decision table written as control flow"
rationale = '''
A run of `if …: return` arms closed by a terminal `return` or `raise` enumerates a closed
decision, one arm per case — but written as sequential ifs the table is invisible and nothing
marks the enumeration complete. One `match` statement is the fixpoint, exactly as for `elif`
chains (ACTC002): a single dispatch point with an explicit default arm. The rule fires only
where the rewrite is safe and profitable — every condition inspects one shared scrutinee
(which `match` evaluates once), or every condition is free of calls and subscripts so hoisting
the conditions cannot change behaviour. Guard chains whose later conditions depend on earlier
arms having returned — a `parent is None` check narrowing what the next call may touch — are
exempt: those conditions must stay sequential. No auto-fix: choosing the scrutinee is
judgement, and a synthesized raising default arm would alter behaviour — a RISKY rewrite
reserved for a human.
'''
banned = '''
def declaration(found, description):
    if found:
        return f"Found config. Running with: {description}"

    if description == ALL:
        return "No config found, running with default"

    return f"No config found, running with: {description}"
'''
wanted = '''
def declaration(found, description):
    match found, description == ALL:
        case True, _:
            return f"Found config. Running with: {description}"

        case _, True:
            return "No config found, running with default"

        case _:
            return f"No config found, running with: {description}"
'''

[[rules]]
code = "ACTL001"
name = "trailing-comma"
group = "actually-literals"
status = "unstable"
fix = "full"
summary = "a dict/list/set literal whose last element lacks a trailing comma"
rationale = '''
Appending, removing, or reordering an element should touch exactly one line — without the
trailing comma the previous last element changes too, polluting every diff. The comma is also
the magic trailing comma that formatters (ruff, black) respect, pinning the multiline layout
instead of collapsing it back to one line.
'''
banned = '''
labels = {
    200: "ok",
    404: "missing"
}
'''
wanted = '''
labels = {
    200: "ok",
    404: "missing",
}
'''

[[rules]]
code = "ACTL002"
name = "one-element-per-line"
group = "actually-literals"
status = "unstable"
fix = "partial"
summary = "a dict/list/set literal with elements sharing a line with a bracket or each other"
rationale = '''
Json-like structures read as records: one element per line with the brackets on their own
lines makes membership scannable and keeps every future diff to the single line it concerns.
The fix rewrites the literal in place; a literal carrying comments or multiline elements is
reported for human formatting instead. Tuples are exempt — they appear in subscripts and type
expressions where this layout is not wanted.
'''
banned = '''
point = {"x": 1, "y": 2}
'''
wanted = '''
point = {
    "x": 1,
    "y": 2,
}
'''

[[rules]]
code = "ACTR001"
name = "blank-before-return"
group = "actually-returns"
status = "stable"
fix = "full"
summary = "a `return` stacked directly under other statements in its block"
rationale = '''
A `return` that follows other statements in its block is the exit point of the function —
stacked flush against the work above it, it reads as just another line. One blank line above
marks the handoff from computing the value to leaving with it.
'''
banned = '''
def f(baz):
    if baz:
        foo = 42 + 1337
        return foo
'''
wanted = '''
def f(baz):
    if baz:
        foo = 42 + 1337

        return foo
'''

[[rules]]
code = "ACTR002"
name = "blank-after-return"
group = "actually-returns"
status = "stable"
fix = "full"
summary = "code directly under a `return` line"
rationale = '''
Code on the line directly under a `return` — typically after the enclosing block dedents —
reads as if it belonged to the same thought. One blank line after the `return` marks that a
flow ended there and something new begins.
'''
banned = '''
def f(foo, bar, baz):
    if foo:
        return foo
    if bar:
        return baz
'''
wanted = '''
def f(foo, bar, baz):
    if foo:
        return foo

    if bar:
        return baz
'''
