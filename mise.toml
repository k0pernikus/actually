[env]
_.python.venv = { path = ".venv" }

[settings]
lockfile = true

[tools]
gh = "latest"
hk = "latest"
uv = "latest"

[tasks.release]
description = "bump version via commitizen and push the release tag"
run = ["uv run cz bump", "git push --follow-tags"]

[tasks.test]
description = "run the full test suite on four xdist workers"
run = "uv run pytest --numprocesses=4"

[tasks.rerun-pipeline]
description = "re-run the failed jobs of the most recent failed workflow run"
run = "gh run list --limit 1 --status failure --json databaseId --jq '.[0].databaseId' | xargs gh run rerun --failed"
