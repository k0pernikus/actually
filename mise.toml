[env]
_.python.venv = { path = ".venv" }

[settings]
lockfile = true

[tools]
gh = "latest"
hk = "latest"
uv = "latest"

[tasks.release]
description = "cut a release: gate a clean tree, bump the version files, commit, tag, push (--dry-run to preview)"
run = "uv run python scripts/release.py"

[tasks.format]
description = "apply every fixer to the code tree: actually, ruff check --fix, ruff format, taplo — never the valid-case corpora"
run = [
  "uv run actually format src scripts tests/*.py tests/valid-code-checks/*.py",
  "uv run ruff check --fix .",
  "uv run ruff format .",
  "uv run taplo format",
]

[tasks.format-valid-cases]
description = "consciously reformat the valid-case corpora per selector, then prove the actually-plus-ruff composite converged — the only sanctioned mutation path for tests/valid-code-checks/allowed/"
run = [
  "uv run python scripts/format_valid_cases.py",
  "uv run ruff format --no-force-exclude tests/valid-code-checks/allowed",
  "uv run ruff format --check --no-force-exclude tests/valid-code-checks/allowed",
]

[tasks.lint]
description = "read-only full gate: ruff format --check, ruff check, actually check, ty, docs freshness, lock sync"
run = [
  "uv run ruff format --check .",
  "uv run ruff check .",
  "uv run actually check src scripts tests/*.py tests/valid-code-checks/*.py",
  "uv run ty check src tests scripts",
  "uv run python scripts/generate_docs.py --check",
  "uv lock --check",
]

[tasks.test]
description = "run the full test suite"
run = "uv run pytest"

[tasks.rerun-pipeline]
description = "re-run the failed jobs of the most recent failed workflow run"
run = "gh run list --limit 1 --status failure --json databaseId --jq '.[0].databaseId' | xargs gh run rerun --failed"
